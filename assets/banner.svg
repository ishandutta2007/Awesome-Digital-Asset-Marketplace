<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    
    /* Subtle background animations placed behind text */
    @keyframes floatParticle1 {
      0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      50% { transform: translate(-30px, 20px) scale(1.1); opacity: 0.6; }
      100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
    }
    @keyframes floatParticle2 {
      0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
      50% { transform: translate(40px, -25px) scale(1.2); opacity: 0.7; }
      100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
    }
    @keyframes pulseLine {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }

    .particle1 { animation: floatParticle1 8s ease-in-out infinite; }
    .particle2 { animation: floatParticle2 10s ease-in-out infinite; }
    .animated-wave {
      stroke-dasharray: 300;
      animation: pulseLine 6s linear infinite;
    }
  </style>

  <!-- Base Rectangle -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Grid overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Dynamic background glowing orbs (Behind text foreground) -->
  <circle class="particle1" cx="200" cy="80" r="120" fill="#6366f1" opacity="0.25" filter="url(#glow)"/>
  <circle class="particle2" cx="1000" cy="240" r="140" fill="#ec4899" opacity="0.2" filter="url(#glow)"/>
  <circle class="particle1" cx="850" cy="70" r="90" fill="#a855f7" opacity="0.2" filter="url(#glow)"/>

  <!-- Geometric Abstract Lines in Background -->
  <path d="M-50 280 Q 300 120, 600 240 T 1250 100" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.4" class="animated-wave"/>
  <path d="M-50 220 Q 400 300, 800 150 T 1250 200" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>

  <!-- Foreground Container Box -->
  <rect x="60" y="45" width="1080" height="230" rx="12" fill="rgba(15, 23, 42, 0.55)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

  <!-- Category Pill / Badge -->
  <g transform="translate(90, 75)">
    <rect width="210" height="32" rx="16" fill="url(#accentGrad)"/>
    <text x="105" y="20" class="badge-text" text-anchor="middle">AWESOME CURATED LIST</text>
  </g>

  <!-- Title & Subtitle in strict Foreground -->
  <text x="90" y="150" class="title">Awesome Digital Asset Marketplace 💎</text>
  <text x="90" y="190" class="subtitle">SaaS Platforms, Open-Source Repos, Creator Commerce &amp; Monetization Ecosystem</text>

  <!-- Bottom Feature Pills -->
  <g transform="translate(90, 220)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="140" height="28" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="70" y="18" class="badge-text" text-anchor="middle">🚀 Creator Stores</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(152, 0)">
      <rect width="160" height="28" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="80" y="18" class="badge-text" text-anchor="middle">📦 Open-Source Repos</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(324, 0)">
      <rect width="160" height="28" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="80" y="18" class="badge-text" text-anchor="middle">💳 Merchant of Record</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(496, 0)">
      <rect width="150" height="28" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="75" y="18" class="badge-text" text-anchor="middle">⚡ Digital Delivery</text>
    </g>
  </g>
</svg>
